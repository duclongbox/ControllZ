# Eclipse JDT formatter settings for signaling-server.
# Only the keys that differ from JDT defaults are listed; Spotless fills the rest.
# Indentation must agree with /.editorconfig (Java = 4 spaces, not tabs).
org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=4
org.eclipse.jdt.core.formatter.indentation.size=4
org.eclipse.jdt.core.formatter.use_tabs_only_for_leading_indentations=false
org.eclipse.jdt.core.formatter.lineSplit=120
org.eclipse.jdt.core.formatter.comment.line_length=100
org.eclipse.jdt.core.formatter.join_wrapped_lines=false
# 16 = one enum constant per line. The default crams them onto continuation lines,
# which turns a readable error catalog into a staircase.
org.eclipse.jdt.core.formatter.alignment_for_enum_constants=16
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=false
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
org.eclipse.jdt.core.formatter.insert_new_line_at_end_of_file_if_missing=insert
